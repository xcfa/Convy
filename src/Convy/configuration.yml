# Convy user configuration.
#
# This file is loaded by the ASP.NET Core configuration pipeline and
# supports hot-reload: changes take effect on the next sync cycle
# without a restart.
#
# Webhooks are called once per sync cycle (batch) after linking finishes,
# with a JSON body { "linked": [ ... ], "errors": [ ... ] }. Available
# property values for params:
#   hash, name, category, savePath, targetPath, size, state, tags
#
# When params are omitted, all properties are sent for each linked torrent.
# names — optional list of rule names (see rules.yaml) this webhook fires for.
#   When omitted/empty the webhook fires for torrents matched by any rule.
# Environment variable alternative:
#   Webhooks__0__Url=https://example.com/hook
#   Webhooks__0__Name=My hook
#   Webhooks__0__Names__0=anime

# ── Logging (Serilog) ──────────────────────────────────────────────────────
# Console output and baseline levels are configured in code (always on, so Docker
# stdout is never lost). This section ADDS the file sinks: everything goes to
# access.log, and Warning/Error/Fatal additionally go to error.log. Files grow
# unbounded — set up rotation yourself (logrotate with `copytruncate`, since the
# process keeps the file handle open).
serilog:
  using:
    - Serilog.Sinks.Async
    - Serilog.Sinks.File
    # - Serilog.Sinks.Seq      # uncomment together with the Seq sink below
  minimumLevel:
    default: Information
    override:
      Microsoft.AspNetCore: Warning
  writeTo:
    # Async wrapper: file writes run on a background worker so logging calls never
    # block on disk I/O. Buffered events are flushed on shutdown by the
    # Log.CloseAndFlushAsync() in Program.cs.
    - name: Async
      args:
        configure:
          - name: File
            args:
              path: /var/log/convy/access.log
              outputTemplate: "{Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] {SourceContext} {Message:lj}{NewLine}{Exception}"
          - name: File
            args:
              path: /var/log/convy/error.log
              restrictedToMinimumLevel: Warning
              outputTemplate: "{Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] {SourceContext} {Message:lj}{NewLine}{Exception}"
    # Seq — structured log server. DISABLED by default; uncomment this entry and the
    # `Serilog.Sinks.Seq` line under `using` above. Example docker-compose service:
    #   seq:
    #     image: datalust/seq
    #     environment: { ACCEPT_EULA: "Y" }
    #     ports: ["5341:80"]
    # - name: Seq
    #   args:
    #     serverUrl: http://seq:5341
    #     # apiKey: your-optional-api-key

# IP allow-list: only requests from these addresses are accepted (others get 403).
# Each entry is a single IP or a CIDR range. When this section is omitted the
# built-in defaults apply: 127.0.0.1, ::1, 192.168.0.0/16, 172.16.0.0/12
# (the last covers Docker bridge networks). Specifying the section REPLACES the
# defaults, so include loopback/LAN explicitly if you still need them.
# Environment variable alternative:
#   IpAccessControl__AllowedNetworks__0=127.0.0.1
#   IpAccessControl__AllowedNetworks__1=10.0.0.0/8

# ipAccessControl:
#   allowedNetworks:
#     - 127.0.0.1
#     - ::1
#     - 192.168.0.0/16
#     - 172.16.0.0/12

# ── Search and download for the agent (MCP) ────────────────────────────────
# Categories tell the agent where to search and how to label a download; where the
# files go is decided by rules.yaml (a job's qbittorrent_category is visible to the
# rules as Category, for every protocol). The `other` category is mandatory: a
# version without it is not applied. Order in `sources` is the priority; without
# `sources` every active source is used, by name. Ids: get_sources (MCP) or
# prowlarr:<indexer id> / soulseek. The prowlarr/soulseek blocks are read only by
# that provider. This file is reloaded on change; a broken edit keeps the previous
# version in effect.
# categories:
#   movies:
#     description: Movies for Jellyfin
#     path_hint: Title (Year)
#     qbittorrent_category: Movies
#     sources: [prowlarr:12, prowlarr:20, prowlarr:7]
#     prowlarr:
#       categories: [2000]        # Newznab ids: 2000 movies, 3000 audio, 5000 TV
#   music:
#     description: Music for Navidrome
#     path_hint: Artist/Year - Album
#     qbittorrent_category: Music
#     sources: [soulseek, prowlarr:15]
#     prowlarr:
#       categories: [3000]
#     soulseek:
#       extensions: [flac, mp3, m4a]
#   other:
#     description: Anything that fits no other category
#     qbittorrent_category: Other
#
# search:
#   batch_size: 3              # sources per search / search_next step
#   max_query_variants: 3      # extra title variants are dropped
#   source_timeout_sec: 20     # per source request
#   max_results: 30            # per step; the rest is dropped ("shown N of M")
#   cache_ttl_hours: 6         # how long result ids stay valid
#
# files:
#   metadata_timeout_sec: 15   # list_files gives up after this (magnet metadata, peers)
#   max_entries: 100           # lines per list_files page

# ── Jobs ───────────────────────────────────────────────────────────────────
# Downloads started by the agent (MCP `download` tool) become jobs with a unified
# status. All values are optional; the defaults are shown.
# jobs:
#   stalled_after_min: 30        # no progress for this long -> status "stalled"
#   max_placement_attempts: 10   # failed hard-link attempts before the job fails
#   max_size_gb: 0               # largest allowed job; 0 = no limit
#   min_free_space_gb: 0         # space that must stay free in the download directory

# webhooks:
#   - name: Send anime to telegram
#     url: https://tg-proxy.example.com/34234324
#     names:            # only fires for torrents routed by the "anime" rule
#       - anime
#     params:
#       - place: Body
#         name: category
#         value: category
#       - place: Body
#         name: torrent
#         value: name
#
#   - name: Catch-all hook       # no `names` -> fires for every rule
#     url: https://example.com/hook
