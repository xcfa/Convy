#         name: category
#         value: category
#       - place: Body
#         name: torrent
#         value: name
#
#   - name: Catch-all hook       # no `names` -> fires for every rule
#     url: https://example.com/hook
#
#   - name: Jobs to n8n          # agent jobs and failing sources
#     url: http://n8n:5678/webhook/media
#     events: [job_status, source_error]
